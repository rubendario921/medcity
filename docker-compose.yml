services:
  db:
    image: postgres:15-alpine
    container_name: medcity-bdd
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./medcity-api
    container_name: medcity-api
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./.env
    environment:
      DB_HOST: db

  web:
    build: ./medcity-web
    container_name: medcity-web
    ports:
      - "80:80"
    depends_on:
      - api
    env_file:
      - ./.env
    environment:
      API_URL: http://localhost:3000

volumes:
  postgres_data:

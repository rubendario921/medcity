services:
  db:
    image: postgres:15-alpine
    container_name: medcity-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./medcity-api
    container_name: medcity-api
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - ./medcity-api/.env
    environment:
      DB_HOST: db

volumes:
  postgres_data:
